<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Library System</title>
 <link rel="stylesheet" href="../css/style.css">
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Story+Script&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
    <div class="blackbar">
        <div class="logo-group">
            <div class="logo">
                <img src="../css/logo.jpg" alt="logo">
            </div>
            <div class="o">
                <h1>Online Library</h1>
            </div>
        </div>

     

        <nav class="auth-links">
            <a href="login.html" class="login-btn">Log In</a>
            <a href="Sign up.html" class="signup-btn">Sign Up</a>
        </nav>
    </div>
</header>

<main class="login-container">
    <div class="login-card">
        <div class="info-section">
            <h1>Log In</h1><br>
            <p style="color:grey">Log in to use your free Online Library to borrow digital books from our collection.</p>
        </div>

        <div class="form-section">
    <form action="#" method="post">
        <div class="input-group">
            <div class="label-row">
                <label for="username">Email</label>
                
            </div>
            <input type="text" id="username" name="username" placeholder="Email" required>
        </div>

        <div class="input-group">
            <div class="label-row">
                <label for="password">Password</label>
                <a href="#" class="small-link">Forgot your password?</a>
            </div>
            <input type="password" id="password" name="password" placeholder="Password" required>
        </div>

        <div class="options">
            <label><input type="checkbox" name="remember"> Remember me</label>
        </div>

        <div class="action-buttons">
            <button type="submit" class="main-login-btn">Log In</button>
        </div>
    </form>

    <p class="signup-footer">Don't have an account? <a href="Sign up.html">Sign up now.</a></p>
</div>
    </div>
</main>

<footer class="site-footer">
    <p>&copy; 2026 Online Library Website | <a href="mailto:support@onlinelibrary.edu">support@onlinelibrary.edu</a></p>
</footer>
</body>
</html>
