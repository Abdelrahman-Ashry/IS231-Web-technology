<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    < <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details</title>
    <link rel="stylesheet" href="../css/Book_Details.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>

<!-- ========== HEADER ========== -->
<header>
    <div class="logo-group">
        <div class="logo">
            <img src="../images/logo.png" alt="Online Library Logo">
        </div>
    </div>
    <nav>
        <a href="User_Dashboard.html">Library Catalog</a>
        <a href="My_Borrowed.html">My Borrowed Books</a>
        <a href="Login.html" class="nav-logout">Logout</a>
    </nav>
</header>

<!-- ========== MAIN CONTENT ========== -->
<div class="page-wrapper">

    <!-- Page Title -->
    <div class="U">
        <h1>Book Details</h1>
    </div>

    <!-- ===== BOOK CARD ===== -->
    <div class="book-details-card">

        <!-- LEFT SIDE — Book Info -->
        <div class="book-info-side">

            <div class="book-header">
                <span class="book-id"></span>
                <h2 class="book-title"></h2>
                <p class="book-author"></p>
            </div>

            <span class="badge"></span>

            <ul class="details-list">
                <li><span class="detail-label">Category</span><span class="detail-value category"></span></li>
                <li><span class="detail-label">Published Year</span><span class="detail-value year"></span></li>
                <li><span class="detail-label">Number of Copies</span><span class="detail-value copies"></span></li>
            </ul>

            <div class="description-box">
                <h3>Description</h3>
                <p></p>
            </div>

            <button class="btn-borrow">Borrow this Book</button>

        </div>

        <!-- RIGHT SIDE — Book Cover Image -->
        <div class="book-image-side">
            <img src="" alt="Book Cover">
        </div>

    </div>
</div>

<!-- ========== FOOTER ========== -->
<footer>
    <p>&copy; 2026 Online Library Website</p>
    <p>Contact us: <a href="mailto:support@onlinelibrary.edu">support@onlinelibrary.edu</a></p>
</footer>
        
<script src="../js/data.js"></script>        
<script src="../js/book_details.js"></script>

</body>
</html>
