<!DOCTYPE html>
<html>
    <head>

        <meta charset="UTF-8">
        <title>Edit book1</title>
        <link rel="icon" type="image/png" href="../images/logo.png">
        <link rel="stylesheet" href="../css/edit.css">
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">  

    </head>

    <body>  

    <nav class="navbar">
      <div class="nav-logo">
        <a href="../html/main.html">
        <img src="../images/logo.png"  class="logo">
        </a>
      </div>

      <div class="nav-links">
        <a href="../html/main.html">Home</a> 
        <a href="../html/Admin_Dashboard.html">Manage Books</a> 
        <a href="../html/Add Book.html">Add New Book</a> 
        <a href="../html/login.html">Logout</a>
      </div>
    </nav>

    <div class="page-container">
      <div class="edit-box">

        <h2>Edit book</h2>

        {% if errors %}
        <div class="error-messages">
            <strong>⚠ Please fix the following:</strong>

            {% for error in errors %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>
        {% endif %}
       
        <form  id="editForm">
           <div class="edit-layout">
        
            <div class="cover-section">
                <img src="The Great Gatspy.jpg" 
                alt="Book Cover" 
                id="coverPhoto"
                class="cover-photo">

            <div class="cover-buttons">
               <label class="change-cover-button">Change<input type="file" id="coverInput"> 
               </label>
               <label class="delete-cover-button" id="deleteCover">Delete</label>
              </div>
            </div>

            <div class="book-info">

              <!--ISBN-->
              <label>ISBN:</label><br>
              <input type="text" id="isbn" readonly>
            

              <!--Book Name-->
              <label>Book Name:</label><br>
              <input type="text" id="bookName">
        

              <!--Author-->
              <label>Author:</label><br>
              <input type="text" id="author">
          

              <!--Category-->
              <label>Category:</label><br>
              <select id="category">
              <option>Fiction</option>
              <option>Non-Fiction</option>
              <option>Science</option>
              <option>Education</option>
              <option>Technology</option>
              <option>History</option>
              <option>Self-Development</option>
              <option>Philosophy</option>
              <option>Religion</option>
              <option>Children's Books</option>
              </select> 
        
              <!--Availability-->
              <label>Availability:</label><br>
              <select id="availability">
              <option>Available</option>
              <option>Not Available</option>
              <option>Borrowed</option>
              <option>Reserved</option>
              <option>Out of stock</option>
              </select>
         
              <!--Published Year-->
              <label>Published Year:</label><br>
              <input type="number" id="year" min="1800" max="2026">
         

              <!--Copies-->
              <label>Number of Copies:</label><br>
              <input type="number" id="copies" min="0" step="1">
        

              <!--Description-->
              <label>Description:</label>
              <br>
              <textarea id = "description" rows="8" cols="40"></textarea>
         

              <!--Buttons-->
              <div class="submit-buttons">
              <button type="submit" class="Update-button" id="updateBtn">Update</button>
              <button type="reset" class="Clear-button" id="clearBtn">Clear</button>
           </div>
          </div>
        </div>
     </form>

       </div>
      </div>
 
   
   <footer class="footer">
     <p>&copy; 2026 Online Library. All rights reserved.</p>
  </footer>
  
   <script src="../js/edit.js"></script>

  </body>
</html>
