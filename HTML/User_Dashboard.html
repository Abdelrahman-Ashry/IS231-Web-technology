<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard - Library</title>
    <link rel="stylesheet" href="../CSS/User.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo-group">
            <div class="logo">
                <img src="../Images/logo.png" alt="logo">
            </div>

        </div>
        <nav>
            <a href="User_Dashboard.html" class="nav-active">Library Catalog</a>
            <a href="My_Borrowed.html">My Borrowed Books</a>
            <a href="Login.html" class="nav-logout">Logout</a>
        </nav>
    </header>

    <!-- PAGE WRAPPER -->
    <div class="page-wrapper">

        <div class="U">
            <h1>User Dashboard</h1><br>
        </div>

        <!-- SEARCH SECTION -->
        <section class="search-section">
            <h2>Search for Books</h2>
            <form action="user_dashboard.html" method="post">
                <div class="search-bar">
                    <input type="text" id="search_query" name="search_query" placeholder="Search by title or author...">
                    <select id="search_category" name="search_category">
                        <option value="">All Categories</option>
                        <option value="fiction">Fiction</option>
                        <option value="non-fiction">Non-Fiction</option>
                        <option value="science">Science</option>
                        <option value="education">Education</option>
                        <option value="technology">Technology</option>
                        <option value="history">History</option>
                        <option value="biography">Biography</option>
                        <option value="self_help">Self-Help</option>
                        <option value="philosophy">Philosophy</option>
                        <option value="religion">Religion</option>
                        <option value="children">Children</option>
                        <option value="other">Other</option>
                    </select>
                    <button type="submit">Search</button>
                </div>
            </form>
        </section>

        <!-- CATALOG SECTION -->
        <section class="catalog-section">
            <div class="section-header">
                <h2>Library Catalog</h2>
            </div>

            <!-- BOOK CARDS GRID -->
            <div class="books-grid"></div>
            <!-- end books-grid -->
        </section>

    </div>
    <!-- end page-wrapper -->

    <footer>
        <p>&copy; 2026 Online Library Website</p>
        <p>Contact us: <a href="mailto:support@onlinelibrary.edu">support@onlinelibrary.edu</a></p>
    </footer>

    <script src="../jS/data.js"></script>
    <script src="../jS/User.js"></script>

</body>
</html>
