<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Manage Books</title>
    <link rel="stylesheet" href="../CSS/Admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">   
</head>
<body>

    <!-- TOP HEADER -->
    <header class="navbar">
        <div class="header-brand">
            <div class="logo-group">
                <div class="logo">
                    <img src="../Images/logo.png" alt="logo">
                </div>

            </div>
        </div>
        <nav>
            <a href="Admin_Dashboard.html" class="nav-active">Manage Books</a>
            <a href="Add Book.html">Add New Book</a>
            <a href="Login.html" class="nav-logout">Logout</a>
        </nav>
    </header>

    <!-- PAGE WRAPPER -->
    <div class="page-wrapper">
        <div class="U">
            <h1>Admin Dashboard</h1><br>
        </div>
        <main>
            <section>

                <!-- Section title + Add button -->
                <div class="section-header">
                    <h2>Available Books</h2>
                    <a href="Add Book.html" class="btn-add">+ Add New Book</a>
                </div>

                <!-- BOOK CARDS GRID -->
                <div class="books-grid"></div>
                <!-- end books-grid -->

            </section>

            <!-- Recently Deleted Books Section -->
            <section class="deleted-section">
                <div class="section-header">
                    <h2>🗑️ Recently Deleted Books</h2>
                </div>
                <div id="deletedBooksContainer">
                    <!-- Will be populated by admin.js -->
                </div>
            </section>
        </main>

    </div>
    <!-- end page-wrapper -->

    <footer>
        <p>&copy; 2026 Online Library Website</p>
    </footer>
    <script src="../jS/data.js"></script>
    <script src="../jS/Admin.js"></script>
    
</body>
</html>
