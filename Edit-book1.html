<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Edit book1</title>
        <link rel="icon" type="image/png" href="site-icon.png">
    </head>

    <body>  
    <h1>Admin dashboard</h1>

    <!--navigation bar-->
    <nav>
    <a href="admin-dashboard.html">Manage Books</a> |
    <a href="Add book.html">Add New Book</a> |
    <a href="logout.html">Logout</a>
    </nav><hr>

   <h2>Edit existing book</h2>
   <br>

   <form action ="#" method="Post">

    <!--ISBN-->
   <label>ISBN:</label><br>
   <input type="text" value="1001"readonly>
   <br><br>

   <!--Book Name-->
   <label>Book Name:</label><br>
   <input type="text" value="Great Gatsby">
   <br><br>


   <!--Author-->
   <label>Author:</label><br>
   <input type="text" value="F.Scott Fitzgerald">
   <br><br>


   <!--Category-->
   <label>Category:</label><br>
   <select>
   <option selected>Fiction</option>
   <option>Non-Fiction</option>
   <option>Education</option>
   <option>Science</option>
   <option>Technology</option>
   <option>Self-Development</option>
   <option>Children</option>
   </select> 
   <br><br>


   <!--Availability-->
   <label>Availability:</label><br>
   <select>
   <option selected>Available</option>
   <option>Not Available</option>
   <option>Borrowed</option>
   <option>Reserved</option>
   <option>Out of stock</option>
   </select>
   <br><br>


   <!--Published Year-->
   <label>Published Year:</label><br>
   <input type="number" value="1950" min="1800" max="2026">
   <br><br>


   <!--Copies-->
   <label>Number of Copies:</label><br>
   <input type="number" value="5" min="0" step="1">
   <br><br>


   <!--Description-->
   <label>Description:</label>
   <br>
   <textarea name= description rows="8" cols="40">
The Great Gatsby is a 1925 tragedy novel
by American writer F. Scott Fitzgerald. </textarea>
   <br><br>

   <!--Buttons-->
   <input type="submit" value="Update Book">
   <input type="reset" value="Clear Form">

   </form>
    </body>

    </html>
