{% load static %}

<!DOCTYPE html><html>
<head>
    <title>Add Book Page</title>
    <meta charset="UTF-8"/>
    <meta name="description" content="You can add your desired book"/><link rel="stylesheet" href="{% static 'style.css' %}">

</head><body><header><nav class="navbar">

    <div class="logo">
        <img src="{% static 'img/logo.png' %}" width="40" height="40" alt="logo">
        <span><b>Online Library</b></span>
    </div>

    <div class="links">
        <a href="{% url 'library:admin_dashboard' %}">Manage Books</a>
        <a href="{% url 'library:add_book' %}">Add New Book</a>
        <a href="{% url 'register:logout' %}">Logout</a>
    </div>

</nav>

<h1>Welcome To Admin Dashboard</h1>

</header><div class="container"><h2>Please Add a New Book</h2>

<form method="POST">

    {% csrf_token %}

    <label>ISBN:</label>
    <br>
    <input id="isbn" name="isbn" type="text" placeholder="Enter Book ID">
    <br><br>

    <label>Book Title:</label>
    <br>
    <input id="title" name="title" type="text" placeholder="Enter Book Title">
    <br><br>

    <label>Book Image:</label>
    <input type="file" name="book_image" accept="image/*">
    <br><br>

    <label>Author Name:</label>
    <br>
    <input id="author" name="author" type="text" placeholder="Enter Author Name">
    <br><br>

    <label>Publisher Name:</label>
    <br>
    <input id="publisher" name="publisher" type="text" placeholder="Enter Publisher Name">
    <br><br>

    <label>Publication Year:</label>
    <br>
    <input id="year" name="year" type="text" placeholder="Enter Publication Year">
    <br><br>

    <label>Number of Copies:</label>
    <br>
    <input id="copies" name="copies" type="text" placeholder="Enter Number of Copies">
    <br><br>

    <label>Category:</label>

    <select name="category" id="category">
        <option value="" disabled selected>--Select a Category--</option>
        <option>Fiction</option>
        <option>Non-Fiction</option>
        <option>Science</option>
        <option>Education</option>
        <option>Technology</option>
        <option>History</option>
        <option>Self-Development</option>
        <option>Philosophy</option>
        <option>Religion</option>
        <option>Children's Books</option>
    </select>

    <br><br>

    <label>Status:</label>

    <select name="status" id="status">
        <option value="" disabled selected>-- Select Status --</option>
        <option>Available</option>
        <option>Borrowed</option>
        <option>Reserved</option>
        <option>Out of Stock</option>
    </select>

    <br><br>

    <label>Description:</label>

    <br><br>

    <textarea name="description" rows="5" cols="50"
              placeholder="Enter Book Description Here:"></textarea>

    <br><br>

    <button type="submit">Add Book</button>
    <button type="reset">Clear</button>

</form>

</div><footer>
    <p>&copy; 2026 Online Library Website</p>
</footer></body>
</html>
