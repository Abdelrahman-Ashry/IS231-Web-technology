{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <link rel="stylesheet" href="{% static 'Add Book.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300..800&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
    <div class="logo">
        <img src="{% static 'img/logo.png' %}" alt="logo">
    </div>
    <nav class="links">
        <a href="{% url 'library:admin_dashboard' %}">Manage Books</a>
        <a href="{% url 'library:add_book' %}">Add New Book</a>
        <a href="{% url 'register:logout' %}" class="nav-logout">Logout</a>
    </nav>
</header>

<div class="container">
    <h2>Add a New Book</h2>

    {% if errors %}
    <ul class="error-list">
        {% for err in errors %}
        <li>{{ err }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
            <label>ISBN:</label>
            <input type="text" name="isbn" placeholder="Enter Book ISBN"
                   value="{{ form_data.isbn|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>Book Title:</label>
            <input type="text" name="title" placeholder="Enter Book Title"
                   value="{{ form_data.title|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>Book Cover Image:</label>
            <input type="file" name="cover" accept="image/*">
        </div>
        <div class="form-group">
            <label>Author Name:</label>
            <input type="text" name="author" placeholder="Enter Author Name"
                   value="{{ form_data.author|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>Publisher Name:</label>
            <input type="text" name="publisher" placeholder="Enter Publisher Name"
                   value="{{ form_data.publisher|default:'' }}">
        </div>
        <div class="form-group">
            <label>Publication Year:</label>
            <input type="number" name="year" placeholder="e.g. 2020"
                   min="1000" max="2026"
                   value="{{ form_data.year|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>Number of Copies:</label>
            <input type="number" name="copies" placeholder="e.g. 5"
                   min="0" value="{{ form_data.copies|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>Category:</label>
            <select name="category" required>
                <option value="" disabled selected>-- Select a Category --</option>
                {% for val, label in categories %}
                <option value="{{ val }}"
                    {% if form_data.category == val %}selected{% endif %}>
                    {{ label }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Status:</label>
            <select name="status">
                {% for val, label in statuses %}
                <option value="{{ val }}"
                    {% if form_data.status == val %}selected{% endif %}>
                    {{ label }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Description:</label>
            <textarea name="description" rows="5"
                      placeholder="Enter Book Description...">{{ form_data.description|default:'' }}</textarea>
        </div>

        <div class="btn-row">
            <button type="submit" class="btn-submit">Add Book</button>
            <button type="reset" class="btn-clear">Clear</button>
        </div>
    </form>
</div>

<footer>
    <p>&copy; 2026 Online Library Website</p>
</footer>

</body>
</html>
