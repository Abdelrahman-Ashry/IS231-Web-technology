<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Add New Book - Admin</title>
    </head>
    <body>
        <header>
            <h1>Admin Dashboard</h1>
            <nav>
                <a href="admin_dashboard.html">Manage Books</a> &nbsp; | &nbsp; 
                <a href="add_book.html">Add New Book</a> &nbsp; | &nbsp; 
                <a href="login.html">Logout</a>
            </nav>
        </header>

        <main>
            <section>
                <h2>Add a New Book</h2>
                <form action="admin_dashboard.html" method="POST">
                    <p>
                        <label for="book_id">Book ID:</label><br>
                        <input type="number" id="book_id" name="book_id" required min="1">
                    </p>
                    <p>
                        <label for="book_name">Book Name:</label><br>
                        <input type="text" id="book_name" name="book_name" required>
                    </p>
                    <p>
                        <label for="author">Author:</label><br>
                        <input type="text" id="author" name="author" required>
                    </p>
                    <p>
                        <label for="category">Category:</label><br>
                        <select id="category" name="category" required>
                            <option value="" disabled selected>--Select a Category--</option>
                            <option value="fiction">Fiction</option>
                            <option value="non-fiction">Non-Fiction</option>
                            <option value="science">Science</option>
                            <option value="education">Education</option>
                            <option value="technology">Technology</option>
                            <option value="history">History</option>
                            <option value="biography">Biography</option>
                            <option value="self_help">Self-Help</option>
                            <option value="philosophy">Philosophy</option>
                            <option value="religion">Religion</option>
                            <option value="children">Children</option>
                            <option value="other">Other</option>
                        </select>
                    </p>
                    <p>
                        <label for="published_year">Published Year:</label><br>
                        <input type="number" id="published_year" name="published_year" required min="1000" max="9999">

                    </p>
                    <p>
                        <label for="status">Availability Status:</label><br>
                        <select id="status" name="status" required>
                            <option value="" disabled selected>-- Select Status --</option>
                            <option value="available">Available</option>
                            <option value="not_available">Not Available</option>
                        </select>
                    </p>
                    <p>
                        <label for="copies">Number of Copies:</label><br>
                        <input type="number" id="copies" name="copies" required min="1">
                    </p>
                    <p>
                        <label for="description">Description:</label><br>
                        <textarea id="description" name="description" rows="5" cols="40" required></textarea>
                    </p>
                    <p>
                        <button type="submit">Add Book</button>
                        <button type="reset">Clear Form</button>
                    </p>
                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Online Library Website</p>
        </footer>
    </body>
</html>
