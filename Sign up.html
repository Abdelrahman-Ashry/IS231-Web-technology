<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
</head>
<body>

    <nav>
        <h2>Welcome</h2>
        <p>Please choose an action:</p>
        <a href="#login-section">Login</a> | 
        <a href="#signup-section">Create New Account</a>
    </nav>
        <br>
    <hr>
        <br>
    

    <section id="signup-section">
        <h3>Sign Up</h3>
        <form action="/signup" method="POST">
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required><br><br>

            <label for="signup-email">Email:</label><br>
            <input type="email" id="signup-email" name="email" required><br><br>

            <label for="signup-psw">Password:</label><br>
            <input type="password" id="signup-psw" name="psw" required><br><br>

            <label for="confirm-psw">Confirm Password:</label><br>
            <input type="password" id="confirm-psw" name="confirm-psw" required><br><br>

            <button type="submit">Register</button>
        </form>
    </section>

</body>
</html>
