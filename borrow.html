<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="borrow.css">
    <script src="https://kit.fontawesome.com/1076022f5d.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <title>Borrow book</title>
</head>

<body class="borrowBookPage">

    <header class="navbar">  
        <div class="logo">
            <a href="user_dashboard.html">
                <img src="images/logo.png" alt="logo">
            </a>
        </div>
        <nav class="nav-links">
            <a href="user_dashboard.html">Library Catalog</a>
            <a href="borrowed_books.html">My Borrowed Books</a>
            <a id="logout" href="login.html">Log out</a>
        </nav>

    </header>

    
    <h1>Borrow book</h1>

    <fieldset class="book">
        <legend>Book Details</legend>
        <div class="bookDetails">
            <img id="bookCover" src="" alt="book cover">
            <div class="bookInfo">
                <p id="bookTitle"></p>
                <p id="bookAuthor"></p>
                <p id="bookCategory"></p>
                <p id="bookYear"></p>
            </div>
        </div>
    </fieldset>
    
    <form id="borrowForm" action="#" method="post"> 
        <fieldset>
            <legend>Borrowing Details</legend>

    <!--Quantity-->    
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" value="1" required>

    <!--Borrow and return date-->
            <div class="dates">
                <div>
                    <label for="bdate">Borrow date:</label>
                    <input type="date" id="bdate" name="bdate" required>
                </div>

                <div>
                    <label for="rdate">Return date</label>
                    <input type="date" id="rdate" name="rdate" required>
                </div>
            </div>
    
    <!--Address-->
            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="8" placeholder="Enter your address here..." required></textarea>

    <!--Payment method-->
            <div class="payment-method">
                <label for="payment">Payment method:</label>

                <input type="radio" id="cash" name="payment" value="cash" required>
                <label for="cash">Cash on delivery</label>
                
                <input type="radio" id="card" name="payment" value="card" required>
                <label for="card">Membership card</label>
            </div>

    <!--Notes-->    
            <label for="notes">Notes:</label>
            <textarea id="notes" name="notes" rows="5" placeholder="Enter any notes here..."></textarea>

            <div class="newspaper">
                <input type="checkbox" id="newspaper" name="newspaper" value="newspaper">
                <label for="newspaper">Subscribe to our newspaper</label>
            </div>
    <!--Buttons-->
            <input id="borrowBtn" type="submit" value="Borrow book">
    <!--Message-->
            <p id="message"></p>
        </fieldset>
    </form>

    <footer class="footer">
        <p>&copy; 2026 Online Library Website</p>

        <div class="footer-links">
            <a href="https://www.facebook.com" target="_blank">    
                <i class="fa-brands fa-facebook"></i>
            </a>
            <a href="https://www.instagram.com" target="_blank">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="mailto:support@onlinelibrary.edu"">About</a>
            <a href="#">Contact</a>
            <a href="#">Help</a>
        </div>
    </footer>
  
    <script src="data.js"></script>
    <script src="borrow.js"></script>

</body>

</html>
